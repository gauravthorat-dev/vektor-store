<!DOCTYPE html>
<html>
<head>
<title>Upload Your Photo</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Glass Card */
.card{
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    border:1px solid rgba(255,215,0,0.3);
    padding:40px;
    border-radius:25px;
    width:350px;
    text-align:center;
    color:white;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

.card h2{
    color:gold;
    margin-bottom:25px;
}

/* Upload Button */
.upload-label{
    display:inline-block;
    padding:12px 22px;
    border-radius:25px;
    background:linear-gradient(45deg,gold,orange);
    color:black;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

#photoInput{
    display:none;
}

/* Preview */
#preview{
    margin-top:20px;
    max-width:260px;
    border-radius:15px;
    display:none;
    border:2px solid rgba(255,215,0,0.4);
}

/* Action Button */
.btn{
    margin-top:25px;
    padding:12px 24px;
    border:none;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    color:white;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.2);
    transition:0.3s;
}

.btn:hover{
    background:gold;
    color:black;
}
</style>
</head>

<body>

<div class="card">
    <h2>Upload Your Photo</h2>

    <label for="photoInput" class="upload-label">Choose Photo</label>
    <input type="file" id="photoInput" accept="image/*">

    <img id="preview">

    <br>
    <a href="tryon.html">
        <button class="btn">Continue to Try-On</button>
    </a>
</div>

<script>
document.getElementById("photoInput").onchange = function(event){
    const reader = new FileReader();
    reader.onload = function(){
        const imgData = reader.result;
        document.getElementById("preview").src = imgData;
        document.getElementById("preview").style.display = "block";

        // Save photo for next page
        localStorage.setItem("userPhoto", imgData);
    };
    reader.readAsDataURL(event.target.files[0]);
};
</script>

</body>
</html>
