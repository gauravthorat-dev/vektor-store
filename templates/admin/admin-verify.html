{% extends "components/navbar.html" %}
{% block content %}

<div style="
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
  font-family: 'Space Grotesk', sans-serif;
">
  <div style="
    background: #111;
    border: 1px solid #222;
    border-radius: 12px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  ">

    <!-- Icon -->
    <div style="
      width: 64px; height: 64px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    ">🔐</div>

    <h2 style="color:#fff; font-size:22px; margin:0 0 6px; letter-spacing:1px;">
      ADMIN VERIFICATION
    </h2>
    <p style="color:#666; font-size:13px; margin:0 0 32px;">
      Logged in as <strong style="color:#ff6b00">{{ user.name }}</strong><br>
      Enter your admin password to continue
    </p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div style="
          background:#1a0000; border:1px solid #ff3333;
          color:#ff6666; padding:12px; border-radius:8px;
          font-size:13px; margin-bottom:20px;
        ">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/admin/verify">
      <input
        type="password"
        name="password"
        placeholder="Admin Password"
        required
        autofocus
        style="
          width: 100%; box-sizing: border-box;
          background: #1a1a1a; border: 1px solid #333;
          color: #fff; padding: 14px 16px;
          border-radius: 8px; font-size: 14px;
          margin-bottom: 16px; outline: none;
          font-family: inherit;
        "
      >
      <button type="submit" style="
        width: 100%; padding: 14px;
        background: #ff6b00; color: #fff;
        border: none; border-radius: 8px;
        font-size: 14px; font-weight: 700;
        letter-spacing: 1px; cursor: pointer;
        font-family: inherit;
      ">
        VERIFY &amp; ENTER ADMIN PANEL
      </button>
    </form>

    <a href="/" style="
      display:block; margin-top:20px;
      color:#555; font-size:12px; text-decoration:none;
    ">← Back to Store</a>

  </div>
</div>

{% endblock %}
